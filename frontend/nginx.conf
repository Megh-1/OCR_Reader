# Same-origin serving, the way vite.config.js's dev proxy does it locally: the static UI from
# here, and every backend route prefix the UI calls forwarded to the API service. A new backend
# route prefix needs an entry in BOTH places.

upstream api {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # A batch is up to BATCH_MAX_DOCUMENTS (50) files of up to MAX_UPLOAD_BYTES (15 MB) each.
    client_max_body_size 800m;

    location ~ ^/(templates|review|results|documents)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s; # the synchronous /documents/process runs OCR inline
        proxy_request_buffering off;
    }

    root /usr/share/nginx/html;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app routes by URL hash, so every other path is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
